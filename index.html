<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aksara Lampung: Kenali Induk Aksara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9f1ef;--ink:#0e2f3b;--sea:#14566b;--gold:#d9a22b;--ruby:#a3243b;--card:#fbfdfc;--ok:#2f7d4f;--line:#b9cfcb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b2229;--ink:#e6f0ee;--sea:#6fb4c6;--gold:#e8b63f;--ruby:#e0607a;--card:#143540;--ok:#6fcf97;--line:#2a5560;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b2229;--ink:#e6f0ee;--sea:#6fb4c6;--gold:#e8b63f;--ruby:#e0607a;--card:#143540;--ok:#6fcf97;--line:#2a5560;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:clamp(1.9rem,6vw,2.8rem);font-weight:800;line-height:1.05;margin:8px 0 6px;letter-spacing:-.02em}
.sub{margin:0 0 20px;max-width:46ch;color:var(--sea)}
.hero{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.hero .g{width:64px;height:64px;flex:none}
.g{background:var(--ink);-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;display:block}
.tapis{height:10px;margin:14px 0 22px;background:
 linear-gradient(135deg,var(--gold) 25%,transparent 25%) -6px 0/12px 10px,
 linear-gradient(225deg,var(--gold) 25%,transparent 25%) -6px 0/12px 10px,
 linear-gradient(315deg,var(--gold) 25%,transparent 25%) 0 0/12px 10px,
 linear-gradient(45deg,var(--gold) 25%,transparent 25%) 0 0/12px 10px;background-color:var(--ruby);border-radius:2px}
.levels{display:grid;gap:10px}
.lv{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.lv:hover{border-color:var(--sea)}
.lv:focus-visible,.btn:focus-visible,.card:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.lv .no{font-weight:800;font-size:1.5rem;width:2ch;color:var(--ruby)}
.lv .gl{display:flex;gap:6px;flex:1}
.lv .gl i{width:30px;height:30px}
.lv .st{font-size:1.1rem;color:var(--gold);letter-spacing:2px;white-space:nowrap}
.lv small{display:block;color:var(--sea)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.btn{font:inherit;font-weight:600;background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:9px 16px;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
.stat{font-weight:600}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.board.c5{grid-template-columns:repeat(5,1fr)}
.card{position:relative;aspect-ratio:3/4;perspective:700px;background:none;border:0;padding:0;cursor:pointer;font:inherit}
.in{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d}
.card.on .in{transform:rotateY(180deg)}
.f,.b{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center}
.b{background:var(--sea);border:3px solid var(--gold);background-image:
 linear-gradient(45deg,transparent 40%,var(--gold) 40% 60%,transparent 60%),
 linear-gradient(-45deg,transparent 40%,var(--gold) 40% 60%,transparent 60%);background-size:22px 22px;background-blend-mode:normal;opacity:1}
.b::after{content:"";position:absolute;inset:7px;border:2px solid var(--gold);border-radius:6px;opacity:.5}
.f{background:var(--card);border:3px solid var(--line);transform:rotateY(180deg)}
.f .g{width:70%;height:70%}
.f .t{font-size:clamp(1.4rem,6vw,2.1rem);font-weight:800;color:var(--ruby)}
.card.ok .f{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.card.ok{cursor:default}
.win{margin-top:22px;padding:20px;border:2px solid var(--gold);border-radius:14px;background:var(--card);text-align:center}
.win h2{margin:0 0 6px;font-size:1.6rem}
.win .stars{font-size:2rem;color:var(--gold);letter-spacing:4px}
.win .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.learn{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.learn div{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;font-weight:600}
.learn .g{width:44px;height:44px;margin:0 auto 2px}
.hint{color:var(--sea);margin:0 0 14px}
.kbtn{margin-top:14px;display:flex;align-items:center;gap:12px;width:100%;font:inherit;font-weight:600;color:var(--bg);background:var(--sea);border:0;border-radius:14px;padding:14px;cursor:pointer;text-align:left}
.kbtn:focus-visible,.kc:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.kbtn .g{width:32px;height:32px;background:var(--bg)}
.kdetail{display:flex;gap:16px;align-items:center;background:var(--card);border:2px solid var(--gold);border-radius:14px;padding:16px;margin-bottom:16px}
.kdetail .g{width:96px;height:96px;flex:none}
.kdetail h2{margin:0;font-size:2rem;color:var(--ruby);line-height:1}
.kdetail p{margin:4px 0 0;color:var(--sea)}
.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kc{font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;cursor:pointer;font-weight:600}
.kc .g{width:52px;height:52px;margin:0 auto 4px}
.kc.sel{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 18%,var(--card))}
.mode b{font-weight:800}
.lives{color:var(--ruby);font-size:1.4rem;letter-spacing:4px;text-align:center}
.tbar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 16px}
.tbar i{display:block;height:100%;width:100%;background:var(--gold)}
.qglyph{width:min(60vw,220px);margin:0 auto 6px;background:var(--card);border:3px solid var(--gold);border-radius:16px;padding:18px;aspect-ratio:1}
.qglyph .g{width:100%;height:100%}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:var(--card);color:var(--ink);border:2px solid var(--line);font-size:1.3rem;padding:14px}
.opt.good{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{background:var(--ruby);color:#fff;border-color:var(--ruby)}
.opt:disabled{cursor:default;opacity:1}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
.slot{aspect-ratio:1;font:inherit;color:var(--sea);background:none;border:2px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:600;padding:6px;cursor:pointer}
.slot.f{border-style:solid;background:var(--card);border-color:var(--sea)}
.slot.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.slot.bad{border-color:var(--ruby);background:color-mix(in srgb,var(--ruby) 14%,var(--card))}
.slot .g{width:100%;height:100%}
.slot:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.draw{position:relative;width:100%;max-width:340px;margin:0 auto 12px;aspect-ratio:1;background:var(--card);border:3px solid var(--gold);border-radius:14px;touch-action:none}
.draw .guide{position:absolute;inset:8%;opacity:.2;pointer-events:none}
.draw .guide.off{display:none}
.draw .guide .g{width:100%;height:100%}
.draw canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
.res{text-align:center;min-height:3.2em;font-weight:600}
.res .stars{font-size:1.8rem;color:var(--gold);letter-spacing:4px}
.ref{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.ref .qglyph{width:96px;margin:0;padding:10px;border-width:2px;flex:none}
.mslots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
.ms{font:inherit;color:var(--ink);background:none;border:2px dashed var(--line);border-radius:10px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-weight:800;font-size:1.05rem}
.ms .box{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.ms .box .g{width:100%;height:100%}
.ms.fl{border-style:solid;background:var(--card);border-color:var(--sea)}
.ms.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card));cursor:default}
.ms.bad{border-color:var(--ruby);background:color-mix(in srgb,var(--ruby) 14%,var(--card))}
.ms.hot{border-color:var(--gold)}
.ms:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.kc.dg{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.dragghost{position:fixed;width:72px;height:72px;transform:translate(-50%,-50%);pointer-events:none;z-index:50;background:var(--card);border:2px solid var(--gold);border-radius:12px;padding:8px;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.dragghost .g{width:100%;height:100%}
.ms.over{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 20%,var(--card))}
.ms{position:relative}
.ms.ok{background:color-mix(in srgb,var(--ok) 26%,var(--card));border:3px solid var(--ok)}
.ms.bad{background:color-mix(in srgb,var(--ruby) 26%,var(--card));border:3px solid var(--ruby)}
.mk{position:absolute;top:-10px;right:-8px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--bg);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.mk.ok{background:var(--ok)}
.mk.bad{background:var(--ruby)}
.mk svg{width:16px;height:16px}
html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
.btn{min-height:44px}
.top{gap:8px}
.stat{text-align:right;font-size:.95rem}
.sec{font-size:1.05rem;font-weight:800;margin:24px 0 10px}
.kbtn{margin-top:0;min-height:64px}
.lvgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lc{font:inherit;color:inherit;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px 12px;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0}
.lc:hover{border-color:var(--sea)}
.lc:focus-visible,.lv:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.lc.wide{grid-column:1/-1}
.lc .lh{display:flex;align-items:baseline;justify-content:space-between}
.lc .n{font-weight:800;font-size:1.6rem;line-height:1;color:var(--ruby)}
.lc .st{color:var(--gold);letter-spacing:2px;font-size:1rem}
.lc .strip{display:flex;gap:4px}
.lc .strip .g{flex:1;min-width:0;aspect-ratio:1;max-width:30px}
.lc small{color:var(--sea);font-weight:600}
.lv.mode{min-height:60px;justify-content:space-between}
.lv.mode b{display:block}
.lv.mode .st{color:var(--sea);font-size:.9rem;letter-spacing:0;font-weight:600;text-align:right}
.board,.board.c5{grid-template-columns:repeat(4,minmax(0,1fr))}
.b{background:var(--sea);background-image:none;border:3px solid var(--gold)}
.b::before{content:"";width:34%;aspect-ratio:1;transform:rotate(45deg);border:3px solid var(--gold);border-radius:3px}
.kgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
.mslots{grid-template-columns:repeat(5,minmax(0,1fr))}
.kc.dg{aspect-ratio:1;padding:6px}
.kc.dg .g{width:100%;height:100%;margin:0}
.kc .g{max-width:100%}
.act2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.act2 .wide{grid-column:1/-1}
.wrap{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion:reduce){.in{transition:none}}
</style>
</head>

var NAMA={ka:"Ka",ga:"Ga",nga:"Nga",pa:"Pa",ba:"Ba",ma:"Ma",ta:"Ta",da:"Da",na:"Na",ca:"Ca",ja:"Ja",nya:"Nya",ya:"Ya",a:"A",la:"La",ra:"Ra",sa:"Sa",wa:"Wa",ha:"Ha",gha:"Gha"};
var LEVELS=[
 {judul:"Lima pertama",ids:["ka","ga","nga","pa","ba"]},
 {judul:"Lima berikutnya",ids:["ma","ta","da","na","ca"]},
 {judul:"Lima ketiga",ids:["ja","nya","ya","a","la"]},
 {judul:"Lima terakhir",ids:["ra","sa","wa","ha","gha"]},
 {judul:"Tantangan: semua aksara",ids:null}
];
var app=document.getElementById("app");
var progress={};
try{var s=localStorage.getItem("aksara-lampung-progress");if(s)progress=JSON.parse(s)||{};}catch(e){}
function save(){try{localStorage.setItem("aksara-lampung-progress",JSON.stringify(progress));}catch(e){}}
function g(id,cls){return '<i class="g '+(cls||"")+'" style="--m:url('+GL[id]+')"></i>';}
function stars(n){return "★★★".slice(0,n)+"☆☆☆".slice(0,3-n);}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function menu(){
 stopT();
 var h='<div class="hero">'+g("ka")+'<div><h1>Aksara Lampung</h1></div></div>';
 h+='<p class="sub">Belajar 20 huruf induk Kelabai Sukhat lewat kamus, kartu, dan latihan.</p><div class="tapis"></div>';
 h+='<button class="kbtn" id="kamus">'+g("ka")+'<span>Kamus aksara<br><small>Lihat 20 huruf induk dan namanya</small></span></button>';
 var done=0;LEVELS.forEach(function(l,i){if(progress[i])done++;});
 h+='<h2 class="sec">Latihan</h2><div class="levels">'
  +modeBtn('mk','Kartu pasangan','Balik kartu, cocokkan aksara dengan nama',done?done+'/5 level':'') 
  +modeBtn('ms','Pasangkan aksara','Seret aksara ke nama yang cocok',progress.susun?'Babak '+progress.susun+'/5':'')
  +modeBtn('mq','Tebak aksara','10 soal, 3 nyawa, 8 detik per soal',progress.tebak?'Terbaik '+progress.tebak+'/10':'')
  +modeBtn('mt','Tulis aksara','Gambar aksara dan dapat penilaian',tulisCount()?tulisCount()+'/20':'')
  +'</div>';
 app.innerHTML=h;
 document.getElementById("kamus").onclick=function(){kamus("ka");};
 document.getElementById("mq").onclick=tebak;
 document.getElementById("ms").onclick=function(){susun(0);};
 document.getElementById("mt").onclick=function(){tulis(Math.floor(Math.random()*20));};
 document.getElementById("mk").onclick=kartu;
}

function kartu(){
 stopT();
 var h='<div class="top"><button class="btn alt" id="back">Menu</button><div class="stat">Kartu pasangan</div></div>';
 h+='<p class="hint">Pilih level. Balik dua kartu dan cocokkan aksara dengan namanya.</p><div class="lvgrid">';
 LEVELS.forEach(function(l,i){
  var ids=l.ids||["ka","nga","ja","nya","gha"];
  var st=progress[i]||0;
  h+='<button class="lc'+(i===4?' wide':'')+'" data-i="'+i+'"><span class="lh"><span class="n">'+(i+1)+'</span><span class="st">'+stars(st)+'</span></span><span class="strip">'+ids.map(function(x){return g(x)}).join("")+'</span><small>'+l.judul+'</small></button>';
 });
 h+='</div>';
 app.innerHTML=h;
 document.getElementById("back").onclick=menu;
 Array.prototype.forEach.call(app.querySelectorAll(".lc"),function(b){b.onclick=function(){play(+b.getAttribute("data-i"));};});
}

function play(i){
 var L=LEVELS[i];
 var ids=L.ids||shuffle(Object.keys(NAMA)).slice(0,10);
 var deck=[];
 ids.forEach(function(id){deck.push({id:id,t:"g"});deck.push({id:id,t:"l"});});
 deck=shuffle(deck);
 var moves=0,found=0,open=[],lock=false;
 var cols=ids.length>5?" c5":"";
 var h='<div class="top"><button class="btn alt" id="back">Kembali</button><div class="stat">Level '+(i+1)+' · <span id="mv">0</span> langkah</div></div>';
 h+='<p class="hint">Balik dua kartu. Cocokkan aksara dengan namanya.</p><div class="board'+cols+'" id="board">';
 deck.forEach(function(c,k){
  var face=c.t==="g"?g(c.id):'<span class="t">'+NAMA[c.id]+'</span>';
  h+='<button class="card" data-k="'+k+'" aria-label="Kartu '+(k+1)+'"><div class="in"><div class="b"></div><div class="f">'+face+'</div></div></button>';
 });
 h+='</div><div id="end"></div>';
 app.innerHTML=h;
 document.getElementById("back").onclick=kartu;
 var cards=app.querySelectorAll(".card");
 Array.prototype.forEach.call(cards,function(el){
  el.onclick=function(){
   var k=+el.getAttribute("data-k");
   if(lock||el.classList.contains("on")||el.classList.contains("ok"))return;
   el.classList.add("on");open.push(k);
   if(open.length===2){
    moves++;document.getElementById("mv").textContent=moves;
    var a=deck[open[0]],b=deck[open[1]];
    if(a.id===b.id){
     open.forEach(function(x){cards[x].classList.add("ok");});
     open=[];found++;
     if(found===ids.length)finish();
    }else{
     lock=true;
     setTimeout(function(){open.forEach(function(x){cards[x].classList.remove("on");});open=[];lock=false;},900);
    }
   }
  };
 });
 function finish(){
  var n=ids.length;
  var s=moves<=n+2?3:(moves<=n*2?2:1);
  if(s>(progress[i]||0)){progress[i]=s;save();}
  var e='<div class="win"><h2>Selesai!</h2><div class="stars">'+stars(s)+'</div><p>'+moves+' langkah untuk '+n+' pasang.</p><div class="learn">';
  ids.forEach(function(id){e+='<div>'+g(id)+NAMA[id]+'</div>';});
  e+='</div><div class="acts"><button class="btn" id="again">Main lagi</button>';
  if(i<LEVELS.length-1)e+='<button class="btn" id="next">Level berikutnya</button>';
  e+='<button class="btn alt" id="menu2">Daftar level</button></div></div>';
  document.getElementById("end").innerHTML=e;
  document.getElementById("again").onclick=function(){play(i);};
  var nx=document.getElementById("next");if(nx)nx.onclick=function(){play(i+1);};
  document.getElementById("menu2").onclick=kartu;
  document.getElementById("end").scrollIntoView({behavior:"smooth",block:"nearest"});
 }
}
var ORDER=Object.keys(NAMA);
var timer=null;
function stopT(){if(timer){clearInterval(timer);timer=null;}}
function modeBtn(id,t,d,b){return '<button class="lv mode" id="'+id+'"><span style="flex:1"><b>'+t+'</b><small>'+d+'</small></span><span class="st">'+b+'</span></button>';}
function tulisCount(){var n=0;ORDER.forEach(function(k){if(progress['t_'+k])n++;});return n;}

function tebak(){
 stopT();
 var qs=shuffle(ORDER).slice(0,10),qi=0,lives=3,score=0,T=8000,left=T,locked=false;
 function render(){
  var id=qs[qi];
  var opts=shuffle([id].concat(shuffle(ORDER.filter(function(x){return x!==id;})).slice(0,3)));
  var h='<div class="top"><button class="btn alt" id="back">Menu</button><div class="stat">Soal '+(qi+1)+'/10 · Skor '+score+'</div></div>';
  h+='<div class="lives" aria-label="Nyawa '+lives+'">'+'♥'.repeat(lives)+'<span style="opacity:.25">'+'♥'.repeat(3-lives)+'</span></div>';
  h+='<div class="tbar"><i id="tb"></i></div><div class="qglyph">'+g(id)+'</div><p class="hint" style="text-align:center;margin-top:12px">Apa nama aksara ini?</p><div class="opts">';
  opts.forEach(function(o){h+='<button class="btn opt" data-id="'+o+'">'+NAMA[o]+'</button>';});
  h+='</div>';
  app.innerHTML=h;
  document.getElementById('back').onclick=function(){stopT();menu();};
  left=T;locked=false;stopT();
  timer=setInterval(function(){left-=100;var b=document.getElementById('tb');if(b)b.style.width=Math.max(0,left/T*100)+'%';if(left<=0)answer(null,null);},100);
  Array.prototype.forEach.call(app.querySelectorAll('.opt'),function(b){b.onclick=function(){answer(b.getAttribute('data-id'),b);};});
 }
 function answer(pick,btn){
  if(locked)return;locked=true;stopT();
  var id=qs[qi],ok=pick===id;
  if(ok)score++;else lives--;
  Array.prototype.forEach.call(app.querySelectorAll('.opt'),function(b){var bid=b.getAttribute('data-id');if(bid===id)b.classList.add('good');else if(b===btn)b.classList.add('bad');b.disabled=true;});
  setTimeout(function(){qi++;if(lives<=0||qi>=qs.length)end();else render();},ok?600:1300);
 }
 function end(){
  stopT();
  var s=score>=9?3:score>=6?2:score>=3?1:0;
  if(score>(progress.tebak||0)){progress.tebak=score;save();}
  var e='<div class="top"><button class="btn alt" id="back">Menu</button><div class="stat">Tebak aksara</div></div><div class="win"><h2>'+(lives<=0?'Nyawa habis':'Selesai!')+'</h2><div class="stars">'+stars(s)+'</div><p>Benar '+score+' dari '+qs.length+' soal. Terbaik: '+progress.tebak+'.</p><div class="acts"><button class="btn" id="again">Main lagi</button><button class="btn alt" id="m2">Menu</button></div></div>';
  app.innerHTML=e;
  document.getElementById('back').onclick=menu;document.getElementById('m2').onclick=menu;
  document.getElementById('again').onclick=tebak;
 }
 render();
}

function susun(r){
 stopT();
 var sets=[ORDER.slice(0,5),ORDER.slice(5,10),ORDER.slice(10,15),ORDER.slice(15,20),null];
 var judul=['Lima pertama','Lima berikutnya','Lima ketiga','Lima terakhir','Campur 10 aksara'];
 var ids=sets[r]||shuffle(ORDER).slice(0,10);
 var names=shuffle(ids),pool=shuffle(ids);
 var placed={},sel=null,wrong=null,errs=0,busy=false;
 function mk(ok){return '<span class="mk '+(ok?'ok':'bad')+'" role="img" aria-label="'+(ok?'Benar':'Salah')+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ok?'<path d="M5 12.5l4.5 4.5L19 7.5"/>':'<path d="M6 6l12 12M18 6L6 18"/>')+'</svg></span>';}
 function done(){return Object.keys(placed).length===ids.length;}
 function render(){
  var h='<div class="top"><button class="btn alt" id="back">Menu</button><div class="stat">Pasangkan aksara · '+judul[r]+'</div></div>';
  if(done()){
   var s=errs<=1?3:errs<=3?2:1;
   if(r+1>(progress.susun||0)){progress.susun=r+1;save();}
   h+='<div class="mslots">';
   names.forEach(function(n){h+='<div class="ms fl ok"><div class="box">'+g(n)+'</div>'+NAMA[n]+mk(true)+'</div>';});
   h+='</div><div class="win"><h2>Semua cocok!</h2><div class="stars">'+stars(s)+'</div><p>'+(errs?errs+' kali salah tempat.':'Tanpa salah.')+'</p><div class="acts">'+(r<sets.length-1?'<button class="btn" id="nx">Babak berikutnya</button>':'')+'<button class="btn alt" id="again">Ulangi</button><button class="btn alt" id="m2">Menu</button></div></div>';
  }else{
   h+='<p class="hint">Seret aksara ke kotak dengan nama yang cocok. Bisa juga ketuk aksara, lalu ketuk kotaknya.</p><div class="mslots">';
   names.forEach(function(n){
    var f=placed[n],isW=wrong&&wrong.slot===n;
    var cls='ms'+(f?' fl ok':'')+(isW?' fl bad':'')+(sel&&!f&&!isW?' hot':'');
    h+='<button class="'+cls+'" data-n="'+n+'" aria-label="Kotak '+NAMA[n]+'"><div class="box">'+(f?g(n):isW?g(wrong.glyph):'')+'</div>'+NAMA[n]+(f?mk(true):isW?mk(false):'')+'</button>';
   });
   h+='</div><div class="kgrid" style="grid-template-columns:repeat(5,minmax(0,1fr))">';
   pool.forEach(function(id){
    if(placed[id]||(wrong&&wrong.glyph===id))return;
    h+='<button class="kc dg'+(sel===id?' sel':'')+'" data-id="'+id+'" aria-label="Aksara">'+g(id)+'</button>';
   });
   h+='</div>';
  }
  app.innerHTML=h;
  document.getElementById('back').onclick=menu;
  function drop(n,id){
   if(busy||placed[n])return;
   if(id===n){placed[n]=true;sel=null;render();}
   else{errs++;wrong={slot:n,glyph:id};sel=null;busy=true;render();
    setTimeout(function(){wrong=null;busy=false;render();},800);}
  }
  function slotAt(x,y){var el=document.elementFromPoint(x,y);return el&&el.closest?el.closest('.ms[data-n]'):null;}
  Array.prototype.forEach.call(app.querySelectorAll('.kc'),function(b){
   var id=b.getAttribute('data-id');
   b.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();if(busy)return;sel=(sel===id)?null:id;render();}};
   b.onpointerdown=function(e){
    if(busy)return;
    var sx=e.clientX,sy=e.clientY,moved=false,ghost=null,over=null;
    try{b.setPointerCapture(e.pointerId);}catch(x){}
    b.onpointermove=function(ev){
     if(!moved&&Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)>6){
      moved=true;ghost=document.createElement('div');ghost.className='dragghost';ghost.innerHTML=g(id);document.body.appendChild(ghost);b.style.opacity='.35';}
     if(!moved)return;
     ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';
     var s=slotAt(ev.clientX,ev.clientY);
     if(s&&placed[s.getAttribute('data-n')])s=null;
     if(over&&over!==s)over.classList.remove('over');
     if(s)s.classList.add('over');
     over=s;
    };
    b.onpointerup=b.onpointercancel=function(ev){
     var isUp=ev.type==='pointerup';
     b.onpointermove=b.onpointerup=b.onpointercancel=null;
     if(ghost)ghost.remove();
     if(over)over.classList.remove('over');
     if(!moved){if(isUp){sel=(sel===id)?null:id;render();}return;}
     b.style.opacity='';
     var s=isUp?slotAt(ev.clientX,ev.clientY):null;
     if(s)drop(s.getAttribute('data-n'),id);
    };
   };
  });
  Array.prototype.forEach.call(app.querySelectorAll('.ms[data-n]'),function(b){b.onclick=function(){
   if(!sel)return;drop(b.getAttribute('data-n'),sel);
  };});
  var nx=document.getElementById('nx');if(nx)nx.onclick=function(){susun(r+1);};
  var ag=document.getElementById('again');if(ag)ag.onclick=function(){susun(r);};
  var m2=document.getElementById('m2');if(m2)m2.onclick=menu;
 }
 render();
}

function tulis(i){
 stopT();
 var id=ORDER[i],W=300;
 var h='<div class="top"><button class="btn alt" id="back">Menu</button><div class="stat">Tulis aksara · '+tulisCount()+'/20 lulus</div></div>';
 h+='<div class="ref"><div class="qglyph">'+g(id)+'</div><div><b style="font-size:1.5rem">'+NAMA[id]+'</b><p class="hint" style="margin:2px 0 0">Gambar aksara ini di kotak bawah dengan jari atau mouse.</p></div></div>';
 h+='<div class="draw"><div class="guide off" id="gd">'+g(id)+'</div><canvas id="cv" width="'+W+'" height="'+W+'"></canvas></div>';
 h+='<div class="act2"><button class="btn alt" id="clr">Hapus</button><button class="btn alt" id="gt">Panduan: mati</button><button class="btn wide" id="chk">Periksa</button></div>';
 h+='<div class="res" id="res" aria-live="polite"></div>';
 h+='<div class="act2"><button class="btn alt wide" id="nx">Aksara lain</button></div>';
 app.innerHTML=h;
 document.getElementById('back').onclick=menu;
  document.getElementById('nx').onclick=function(){var j;do{j=Math.floor(Math.random()*20);}while(j===i);tulis(j);};
 var cv=document.getElementById('cv'),cx=cv.getContext('2d');
 cx.lineWidth=22;cx.lineCap='round';cx.lineJoin='round';cx.strokeStyle='#a3243b';cx.fillStyle='#a3243b';
 var drawing=false,last=null,inked=false;
 function pos(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*W/r.height};}
 cv.onpointerdown=function(e){e.preventDefault();drawing=true;inked=true;try{cv.setPointerCapture(e.pointerId);}catch(x){}
  last=pos(e);cx.beginPath();cx.arc(last.x,last.y,11,0,7);cx.fill();};
 cv.onpointermove=function(e){if(!drawing)return;var p=pos(e);cx.beginPath();cx.moveTo(last.x,last.y);cx.lineTo(p.x,p.y);cx.stroke();last=p;};
 cv.onpointerup=cv.onpointercancel=function(){drawing=false;};
 document.getElementById('clr').onclick=function(){cx.clearRect(0,0,W,W);inked=false;document.getElementById('res').innerHTML='';};
 document.getElementById('gt').onclick=function(){var gd=document.getElementById('gd');gd.classList.toggle('off');this.textContent='Panduan: '+(gd.classList.contains('off')?'mati':'nyala');};
 var img=new Image();img.src=GL[id];
 document.getElementById('chk').onclick=function(){
  var res=document.getElementById('res');
  if(!inked){res.textContent='Gambar dulu aksaranya.';return;}
  var gc=document.createElement('canvas');gc.width=gc.height=W;var gx=gc.getContext('2d');
  gx.drawImage(img,24,24,252,252);
  var G=gx.getImageData(0,0,W,W).data;
  var dc=document.createElement('canvas');dc.width=dc.height=W;var dx=dc.getContext('2d');
  var R=14;
  for(var a=0;a<8;a++){dx.drawImage(img,24+Math.cos(a*Math.PI/4)*R,24+Math.sin(a*Math.PI/4)*R,252,252);dx.drawImage(img,24+Math.cos(a*Math.PI/4)*R/2,24+Math.sin(a*Math.PI/4)*R/2,252,252);}
  dx.drawImage(img,24,24,252,252);
  var D=dx.getImageData(0,0,W,W).data,U=cx.getImageData(0,0,W,W).data;
  var gn=0,un=0,gi=0,ui=0;
  for(var p=3;p<G.length;p+=4){
   var gg=G[p]>100,uu=U[p]>100,dd=D[p]>100;
   if(gg)gn++;if(uu)un++;if(gg&&uu)gi++;if(uu&&dd)ui++;
  }
  var cov=gn?gi/gn:0,prec=un?ui/un:0,f=(cov+prec)?2*cov*prec/(cov+prec):0;
  var pct=Math.round(f*100),s=f>=0.7?3:f>=0.55?2:f>=0.42?1:0;
  var msg;
  if(s>0){msg='Kemiripan '+pct+'%. '+(s===3?'Bagus sekali!':'Lumayan, bisa lebih rapi.');
   if(s>(progress['t_'+id]||0)){progress['t_'+id]=s;save();}}
  else if(cov<prec)msg='Kemiripan '+pct+'%. Ada bagian aksara yang belum tergambar.';
  else msg='Kemiripan '+pct+'%. Gambar melebar dari bentuk aksara.';
  res.innerHTML=(s>0?'<div class="stars">'+stars(s)+'</div>':'')+msg;
 };
}

var CAN_SPEAK=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);
function speak(id){
 if(!CAN_SPEAK)return false;
 try{
  window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(NAMA[id].toLowerCase());
  u.lang='id-ID';u.rate=0.7;
  var vs=window.speechSynthesis.getVoices().filter(function(v){return v.lang&&v.lang.toLowerCase().indexOf('id')===0;});
  if(vs.length)u.voice=vs[0];
  window.speechSynthesis.speak(u);
  return true;
 }catch(e){return false;}
}
function kamus(sel){
 var keys=Object.keys(NAMA);
 var n=keys.indexOf(sel)+1;
 var h='<div class="top"><button class="btn alt" id="back">Menu</button><div class="stat">Kamus aksara</div></div>';
 h+='<div class="kdetail">'+g(sel)+'<div><h2>'+NAMA[sel]+'</h2><p>Huruf induk ke-'+n+' dari 20</p><p>Dibaca "'+NAMA[sel].toLowerCase()+'"</p>'+(CAN_SPEAK?'<button class="btn" id="sp" style="margin-top:10px;display:inline-flex;align-items:center;gap:8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/></svg>Dengarkan</button>':'<p class="hint" style="margin-top:8px">Suara tidak didukung di peramban ini.</p>')+'</div></div>';
 h+='<div class="kgrid">';
 keys.forEach(function(id){h+='<button class="kc'+(id===sel?' sel':'')+'" data-id="'+id+'">'+g(id)+NAMA[id]+'</button>';});
 h+='</div>';
 app.innerHTML=h;
 document.getElementById("back").onclick=menu;
 Array.prototype.forEach.call(app.querySelectorAll(".kc"),function(b){b.onclick=function(){var id=b.getAttribute("data-id");kamus(id);speak(id);window.scrollTo({top:0,behavior:"smooth"});};});
 var sp=document.getElementById("sp");if(sp)sp.onclick=function(){speak(sel);};
}
menu();
</script>
